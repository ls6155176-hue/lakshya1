 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
     background: linear-gradient(-45deg, #f36a01bf, #ff8c00, #ff4500, #ff6347);
            background-size: 400% 400%;
        }
        
        .main{
            padding:  20px ;
            padding-top: 50px;
            padding-left: 50px;
            padding-bottom: 50px;
            padding-right: 50px;
            height: 200px;
            width: 300px;
            background-color: aquamarine;
            border: 3px solid black;
            border-radius: 20px;
            box-shadow: 20px 20px 10px rgba(0, 0, 0, 0.5);
            box-shadow: 30px 30px 15px rgba(0, 0, 0, 0.5);
            background: linear-gradient(orange, white,green);
            margin-top: 200px;
            margin-left: 500px;
            margin-bottom: 200px;
            margin-right: 10px;
            font-size: 15px;
            font-weight: 600;
            font-style: italic;
            
            
        }
    

        .worker{
            height:200px;
            width: 250px;
            background-color: lightslategray;
            border: 2px solid black;
            border-radius: 20px;
            box-shadow: 15px 15px 10px rgba(0, 0, 0, 0.021);
            box-shadow: 25px 25px 15px rgba(0, 0, 0, 0.374);
            color: rgb(240, 248, 255);
            text-align: center;
            text-shadow: 3px 2px  rgb(216, 237, 54);
            font-size: 300%;

        }
         .worker:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
    }
    </style>
</head>
<body>
    <div class="main">
        <div class="worker"> 
            Hello World
        </div>
    </div>
</body>
</html>
