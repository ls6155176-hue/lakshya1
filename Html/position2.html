<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .relative{
            position: relative;
            top: 20px;
            background-color: lime;
            border: 3px solid black
        }
        .absolute{
            top: 150px;
            left: 150px;
            position: absolute;
            background-color: aquamarine;
        }
        .fixed{
            position: fixed;
            top: 0px;
            left: 100px;
            background-color: red;
        }
        
    </style>

</head>
<body>
    <div class="relative">hello position</div>
        <div class="absolute">
            absolute position
        </div>
    <div class="fixed">
        poditin fix 
    </div>
</body>
</html>
