<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profiles</title>
    <style>
        body {
            background-image: url(image/w.jpeg);
            background-size: cover;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .profile-section {
            margin: 30px auto;
            max-width: 800px;
            background-color: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
        }
        
        h1 {
            color: #ffff;
            background-color: #fa6a04;
            padding: 10px;
            border-radius: 5px;
        }
        
        h2 {
            color: rgb(212, 236, 35);
            background-color: black;
            padding: 8px;
        }
        
        .profile-img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border: 3px solid #fa6a04;
            border-radius: 5px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .profile-img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(250, 106, 4, 0.8);
        }
        
        @media (max-width: 600px) {
            .profile-section {
                margin: 15px auto;
                padding: 10px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            h2 {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="profile-section">
        <h1>Rohit Sharma Insta profile</h1>
        <h2>click the photo and show</h2>
        <a href="https://www.instagram.com/rohitsharma45/">
            <img class="profile-img" src="image/download.jpg" alt="Rohit Sharma Insta profile">
        </a>
    </div>
    
    <div class="profile-section">
        <h1>Virat Kohli Insta profile</h1>
        <h2>click the photo and show</h2>
        <a href="https://www.instagram.com/virat.kohli/">
            <img class="profile-img" src="image/download (1).jpg" alt="Virat Kohli Insta profile">
        </a>
    </div>
    
    <div class="profile-section">
        <h1>Pramanand Maharaj Insta Profile</h1>
        <h2>click the photo and show</h2>
        <a href="https://www.instagram.com/bhajanmarg_official/">
            <img class="profile-img" src="image/download (2).jpg" alt="Pramanand Maharaj Insta profile">
        </a>
    </div>
</body>
</html>
