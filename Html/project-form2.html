    <style>
        /* Responsive video wrapper (16:9) used for embedded videos */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 16px 0;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

         <h1>The input list Attribute</h1>
        <P>the list Attribute refers to a datalist element that contain pre-defined options for an input element.</P>
