<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative CSS Showcase</title>
   <!--this is part of internal css -->
    <style>
        .html, .css, .js, .font{
            height: 55px;
            width: 200px;
            border-radius: 20px;
            font-size: 40px;
            /* Added for alignment and interaction */
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease-in-out;
            font-weight: bold;
            color: #333;
        }
        .html:hover, .css:hover, .js:hover, .font:hover {
            transform: scale(1.05);
            cursor: pointer;
        }
        .html{
            background-color: #ffc107;
            border: 3px solid #e0a800;
        }
        .css{
            background-color: #e91e63;
            color: white;
            border: 3px solid #c2185b;
        }
        .js{
            background-color: #03a9f4;
            color: white;
            border: 3px solid #0288d1;
        }

        .font{
        
            border: 3px solid   rgb(58, 57, 57);
            width: 120px;
            background-color: lightgray;
        }

        .image img{
            height: 200px;
            width: 200px;
            border-radius: 100px;
            border: 5px solid white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); /* Softer shadow */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .image img:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.2);
        }

    </style>
</head>
<body style="font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; margin: 0;">
    <!--this class is used to help for link head internal css to body html -->
    <div class="html" ><!--class act as identifiers ,allowing for style-->
        hello html
    </div>
    <div class="css">
        hello css
    </div>
     <div class="js">
        hello js
    </div>
    <div class="font">
        <b style="font-size: 30px;"> Image</b>
    </div>
    <div class="image">
        <img src="image/channels4_profile.jpg" alt="Profile Picture">
    </div>
</body>
</html>
